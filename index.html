<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow - To-Do List</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="background-shape shape-one"></div>
    <div class="background-shape shape-two"></div>

    <main class="todo-container">

        <section class="todo-card">

            <div class="header">
                <div class="icon-box">
                    <i class="fa-solid fa-list-check"></i>
                </div>

                <div>
                    <p class="small-title">MY TASKS</p>
                    <h1>TaskFlow</h1>
                </div>
            </div>

            <p class="subtitle">
                Organize your day, one task at a time.
            </p>

            <div class="input-section">
                <input type="text" id="taskInput" placeholder="What needs to be done?" autocomplete="off">

                <button id="addTaskBtn">
                    <i class="fa-solid fa-plus"></i>
                    <span>Add Task</span>
                </button>
            </div>

            <div class="task-info">
                <span id="taskCount">0 tasks</span>
                <span class="status">
                    <span class="status-dot"></span>
                    In Memory
                </span>
            </div>

            <div id="taskList" class="task-list"></div>

            <div id="emptyState" class="empty-state">
                <div class="empty-icon">
                    <i class="fa-solid fa-clipboard-list"></i>
                </div>

                <h2>No tasks yet</h2>

                <p>
                    Add your first task and start getting things done.
                </p>
            </div>

            <div class="footer">
                <i class="fa-solid fa-bolt"></i>
                Simple • Fast • No Persistence
            </div>

        </section>

    </main>

    <script src="script.js"></script>
</body>

</html>
